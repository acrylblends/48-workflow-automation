# Generated by acrylblends: the DSH overlay that mounts the ACRYL frame. Regenerate instead of editing.
- insert:
    - id: app-instance
      name: ./app/runtime.mjs
    - id: acryl-door
      name: ./plugins/door/src/index.ts
      config:
        hostIndex: false
        appBase: /app
        # Added for Workflow Automation (the generator does not carry blend.yaml's door config yet): the automation tools for terminal agents.
        tools:
          expose: [automation_list_workflows, automation_get_workflow, automation_create_workflow, automation_rename_workflow, automation_search_nodes, automation_get_node_definition, automation_get_dynamic_fields, automation_set_trigger, automation_add_step, automation_update_step, automation_remove_step, automation_validate_workflow, automation_test_workflow, automation_publish_workflow, automation_activate_workflow, automation_deactivate_workflow, automation_list_runs, automation_get_run, automation_explain_run_failure, automation_cancel_run, automation_list_connections]
    - id: app-plugins
      name: ./frame/app-plugins.mjs
      isolate: {"extensions":true,"home":true}
    - id: app-routes
      name: ./src/frame.ts
    - id: acryl-router
      name: '@acryldev/blends/cordis/router'
      config:
        trailingSlash: ignore
    - id: acryl-router-http
      name: '@acryldev/blends/cordis/router-http'
    - id: acryl-web-service
      name: '@acryldev/web'
    - id: acryl-settings
      name: '@acryldev/settings'
    - id: acryl-app-shell
      name: '@acryldev/app-shell'
    - id: acryl-versions
      name: '@acryldev/versions'
    - id: acryl-blends-frame
      name: '@acryldev/blends-frame'
      config:
        appPage: /app
    - id: acryl-plugin-admin
      name: '@acryldev/plugin-admin'
    - id: acryl-system-prompt
      name: '@acryldev/system-prompt'
      config:
        identity: "You are an expert coding assistant operating inside an ACRYL Blends app, an app made of Cordis plugins that blend.yaml composes and that you extend by writing plugins. You help users by reading files, executing commands, editing code, and writing new files, and by building, changing and removing the app's plugins when asked."
    - id: acryl-app-context
      name: '@acryldev/app-context'
    - id: acryl-support
      name: '@acryldev/support'
    - id: acryl-sign-in
      name: '@acryldev/sign-in'
    - id: ui-brand-acryl
      name: '@acryldev/brand-client'
    - id: skill-mcp-manager
      name: skill-mcp-manager
- id: connection
  inject: []
  config:
    trustedHosts: !!js "['127.0.0.1', ...(process.env.ACRYL_PUBLIC_ORIGIN ? [new URL(process.env.ACRYL_PUBLIC_ORIGIN).host] : [])]"
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_HOME
- id: office-to-pdf
  disabled: true
- id: ui-brand-official
  disabled: true
